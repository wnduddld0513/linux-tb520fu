name: TB520FU sync with original port

# Merges enij90/armada-tb321fu main into this port and opens a pull request for
# review. On a conflict nothing is pushed: an issue lists the files to resolve
# by hand. Runs on demand; uncomment the schedule to run it daily.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: tb520fu-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM: https://github.com/enij90/armada-tb321fu.git
    steps:
      - name: Check out tb520fu
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: tb520fu
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "${UPSTREAM}"
          git remote set-url --push upstream /dev/null
          git fetch --quiet upstream main

          ahead="$(git rev-list --count HEAD..upstream/main)"
          echo "ahead=${ahead}" >> "${GITHUB_OUTPUT}"
          if [ "${ahead}" -eq 0 ]; then
            echo "Up to date with enij90/armada-tb321fu main."
            exit 0
          fi
          if gh pr list --repo "${GITHUB_REPOSITORY}" --state open --search "head:sync/upstream-" --json number --jq '.[0].number' | grep -q .; then
            echo "A sync pull request is already open; leaving it to review."
            echo "ahead=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          branch="sync/upstream-$(date -u +%Y%m%d)"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          git switch --quiet -c "${branch}"
          if git merge --no-ff --no-edit -m "Merge enij90/armada-tb321fu main (${ahead} commits)" upstream/main; then
            echo "conflict=false" >> "${GITHUB_OUTPUT}"
          else
            {
              echo "conflict=true"
              echo "files<<EOF"
              git diff --name-only --diff-filter=U
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
            git merge --abort
          fi

      - name: Open the pull request
        if: steps.merge.outputs.ahead != '0' && steps.merge.outputs.conflict == 'false'
        env:
          BRANCH: ${{ steps.merge.outputs.branch }}
          AHEAD: ${{ steps.merge.outputs.ahead }}
        run: |
          set -euo pipefail
          git push --quiet origin "${BRANCH}"
          {
            echo "Merges ${AHEAD} new commits from enij90/armada-tb321fu main."
            echo
            echo '```'
            git log --oneline --no-merges "origin/tb520fu..upstream/main" | head -n 60
            echo '```'
            echo
            echo "Check the package patches still apply before merging: the merge itself"
            echo "only proves the files merge."
          } > body.md
          gh pr create --repo "${GITHUB_REPOSITORY}" --base tb520fu --head "${BRANCH}" \
            --title "Sync with enij90/armada-tb321fu main ($(date -u +%Y-%m-%d))" \
            --body-file body.md

      - name: Report a conflict
        if: steps.merge.outputs.ahead != '0' && steps.merge.outputs.conflict == 'true'
        env:
          FILES: ${{ steps.merge.outputs.files }}
          AHEAD: ${{ steps.merge.outputs.ahead }}
        run: |
          set -euo pipefail
          {
            echo "Merging ${AHEAD} new commits from enij90/armada-tb321fu main conflicts in:"
            echo
            printf '%s\n' "${FILES}" | sed 's/^/- `/; s/$/`/'
            echo
            echo "Merge \`upstream/main\` by hand and resolve these files."
          } > body.md
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "Sync with enij90/armada-tb321fu needs a manual merge ($(date -u +%Y-%m-%d))" \
            --body-file body.md
